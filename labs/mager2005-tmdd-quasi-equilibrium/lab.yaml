schema_version: '2.0'
title: Mager2005 - Quasi-equilibrium pharmacokinetic model for drugs exhibiting target-mediated
  drug disposition Lab
description: This model was developed with the aim of constructing an equilibrium
  model of the pharmacokinetic behaviour of a drug exhibiting target-mediated drug
  disposition (TMDD). It can be used to explore dose-response dynamics and compare
  treatment scenarios across conditions.
models:
- alias: pharmacology_sbml_mager2005_quasi_equilibrium_pharmacokinetic_mode_biomd0000000765_model
  path: models/core
  parameters:
    model_path: data/BIOMD0000000765.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: pharmacology_sbml_mager2005_quasi_equilibrium_pharmacokinetic_mode_biomd0000000765_model.state
  to:
  - visualisation.pharmacology_sbml_mager2005_quasi_equilibrium_pharmacokinetic_mode_biomd0000000765_model_state
- from: pharmacology_sbml_mager2005_quasi_equilibrium_pharmacokinetic_mode_biomd0000000765_model.summary
  to:
  - visualisation.pharmacology_sbml_mager2005_quasi_equilibrium_pharmacokinetic_mode_biomd0000000765_model_summary
- from: pharmacology_sbml_mager2005_quasi_equilibrium_pharmacokinetic_mode_biomd0000000765_model.species_labels
  to:
  - visualisation.pharmacology_sbml_mager2005_quasi_equilibrium_pharmacokinetic_mode_biomd0000000765_model_species_labels
runtime:
  duration: 24.0
  communication_step: 1.0
  initial_inputs: {}
tags:
- pharmacology
- pharmacokinetics
- tmdd
- receptor-binding
- sbml
- tellurium
- faithful
- biomodels_ebi
