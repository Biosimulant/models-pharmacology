    label: Simulation summary
  - name: species_labels
    maps_to: pharmacology_sbml_elias2025_physiologically_based_pharmacokinetics_model2510140001_model.species_labels
    label: Observable labels
  - name: glimepiride_liver_plasma
    maps_to: pharmacology_sbml_elias2025_physiologically_based_pharmacokinetics_model2510140001_model.glimepiride_liver_plasma
