  - name: glimepiride_arterial_plasma
    maps_to: pharmacology_sbml_elias2025_physiologically_based_pharmacokinetics_model2510140001_model.glimepiride_arterial_plasma
    label: Glimepiride Arterial Plasma
  - name: glimepiride_venous_plasma
    maps_to: pharmacology_sbml_elias2025_physiologically_based_pharmacokinetics_model2510140001_model.glimepiride_venous_plasma
