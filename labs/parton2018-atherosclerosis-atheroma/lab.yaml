  to:
  - visualisation.pharmacology_sbml_parton2018_a_model_of_atherosclerosis_and_athero_model1812100001_model_species_labels
runtime:
  duration: 10.0
  communication_step: 0.5
  initial_inputs: {}
tags:
- pharmacology
- cardiovascular
- physiology
- inflammation
- systems-biology
- sbml
- tellurium
- faithful
- biomodels_ebi
