schema_version: '2.0'
title: Telesco2011_HER3-ErbB3-RTK_SignalingNetwork
description: 'This model is from the article: A multiscale modeling approach to investigate
  molecular mechanisms of pseudokinase activation and drug resistance in the HER3/ErbB3
  receptor tyrosine kinase signaling n. It can be used to explore dose-response dynamics
  and compare treatment scenarios across conditions.'
standard: sbml
tags:
- pharmacology
- signaling
- oncology
- receptor-tyrosine-kinase
- sbml
- tellurium
- faithful
- biomodels_ebi
authors:
- Biosimulant Team
- Shannon E Telesco
- Andrew J Shih
- Fei Jia
- Ravi Radhakrishnan
upstream:
  id: biomodels_ebi:MODEL1102210001
  source_db: biomodels_ebi
  source_id: MODEL1102210001
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1102210001
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1102210001?filename=MODEL1102210001_url.xml
  license: CC0
biosim:
  entrypoint: src.telesco2011_her3_erbb3_rtk_signalingnetwork_model1102210001_model:Telesco2011Her3Erbb3RtkSignalingnetworkModel1102210001Model
  init_kwargs:
    model_path: data/MODEL1102210001.xml
    integration_step: 0.2
  communication_step: 2.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: initial_total_her3_receptor
    maps_to: Her3
    label: Initial Total HER3 Receptor
    description: initial HER3 receptor pool. Maps to SBML symbol `Her3`.
  - name: initial_her3_neuregulin_complex
    maps_to: Her3_Nrg
    label: Initial HER3 Neuregulin Complex
    description: initial HER3-neuregulin complex. Maps to SBML symbol `Her3_Nrg`.
  - name: initial_phosphorylated_her3_neuregulin_pi3k_complex
    maps_to: pHer3_2_Nrg_Pi3k
    label: Initial Phosphorylated HER3 Neuregulin PI3K Complex
    description: initial phosphorylated HER3-neuregulin-PI3K complex. Maps to SBML
      symbol `pHer3_2_Nrg_Pi3k`.
  - name: initial_internalized_phosphorylated_her3_pi3k_complex
    maps_to: ipHer3_2_Nrg_Pi3k
    label: Initial Internalized Phosphorylated HER3 PI3K Complex
    description: initial internalized phosphorylated complex. Maps to SBML symbol
      `ipHer3_2_Nrg_Pi3k`.
  outputs:
  - name: state
    maps_to: state
    label: Tracked source state
    description: Tracked SBML observable record for reproducibility and downstream
      visualisation.
  - name: summary
    maps_to: summary
    label: Simulation summary
    description: Largest-change and peak summary across tracked observables.
  - name: species_labels
    maps_to: species_labels
    label: Observable labels
    description: Mapping from raw SBML observable symbols to display labels.
  - name: phosphorylated_her3_neuregulin_pi3k_complex
    maps_to: pHer3_2_Nrg_Pi3k
    label: Phosphorylated HER3 Neuregulin PI3K Complex
    description: Phosphorylated HER3 Neuregulin PI3K Complex. Maps to SBML symbol
      `pHer3_2_Nrg_Pi3k`.
  - name: phosphorylated_her3_1_neuregulin_pi3k_complex
    maps_to: pHer3_1_Nrg_Pi3k
    label: Phosphorylated HER3 1 Neuregulin PI3K Complex
    description: Phosphorylated HER3 1 Neuregulin PI3K Complex. Maps to SBML symbol
      `pHer3_1_Nrg_Pi3k`.
  - name: phosphorylated_her3_neuregulin_pi3k_pip2_complex
    maps_to: pHer3_2_Nrg_Pi3k_Pip2
    label: Phosphorylated HER3 Neuregulin PI3K PIP2 Complex
    description: Phosphorylated HER3 Neuregulin PI3K PIP2 Complex. Maps to SBML symbol
      `pHer3_2_Nrg_Pi3k_Pip2`.
  - name: internalized_phosphorylated_her3_neuregulin_pi3k_complex
    maps_to: ipHer3_2_Nrg_Pi3k
    label: Internalized Phosphorylated HER3 Neuregulin PI3K Complex
    description: Internalized Phosphorylated HER3 Neuregulin PI3K Complex. Maps to
      SBML symbol `ipHer3_2_Nrg_Pi3k`.
  - name: internalized_phosphorylated_her3_neuregulin_pi3k_pip2_complex
    maps_to: ipHer3_2_Nrg_Pi3k_Pip2
    label: Internalized Phosphorylated HER3 Neuregulin PI3K PIP2 Complex
    description: Internalized Phosphorylated HER3 Neuregulin PI3K PIP2 Complex. Maps
      to SBML symbol `ipHer3_2_Nrg_Pi3k_Pip2`.
parameters:
- name: integration_step
  value: 0.2
  min: 0.0
  units: model_time
  description: Output sampling step for the Tellurium simulator.
