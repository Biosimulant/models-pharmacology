schema_version: '2.0'
title: "Dold\xE1nMartelli2013 - A Mathematical Model for the Rational Design of Chimeric\
  \ Ligands in Selective Drug Therapies"
description: This model attempts to provide a mathematical framework for describing
  the dynamics of receptor-drug complex formation of chimeric drugs. It can be used
  to explore dose-response dynamics and compare treatment scenarios across conditions.
standard: sbml
tags:
- pharmacology
- drug-discovery
- receptor-binding
- systems-biology
- sbml
- tellurium
- faithful
- biomodels_ebi
authors:
- Biosimulant Team
- "V Dold\xE1n-Martelli"
- R Guantes
- "D G M\xEDguez"
upstream:
  id: biomodels_ebi:MODEL1907310001
  source_db: biomodels_ebi
  source_id: MODEL1907310001
  standard: sbml
  original_url: https://www.ebi.ac.uk/biomodels/MODEL1907310001
  download_url: https://www.ebi.ac.uk/biomodels/model/download/MODEL1907310001?filename=DoldanMartelli2013.xml
  license: CC0
biosim:
  entrypoint: src.dold_nmartelli2013_a_mathematical_model_for_the_model1907310001_model:DoldNmartelli2013AMathematicalModelForTheModel1907310001Model
  init_kwargs:
    model_path: data/MODEL1907310001.xml
    integration_step: 0.2
  communication_step: 2.0
runtime:
  python_version: '3.12'
  dependencies:
    packages:
    - tellurium==2.2.11.2
io:
  inputs:
  - name: ligand_concentration
    maps_to: L
    label: Ligand Concentration
    description: Initial setting for source boundary ligand concentration. Maps to
      SBML symbol `L`.
  - name: target_1_association_rate
    maps_to: k_on_1
    label: Target 1 Association Rate
    description: target-1 association rate. Maps to SBML symbol `k_on_1`.
  - name: target_1_dissociation_rate
    maps_to: k_off_1
    label: Target 1 Dissociation Rate
    description: target-1 dissociation rate. Maps to SBML symbol `k_off_1`.
  - name: target_2_association_rate
    maps_to: k_wt_on_2
    label: Target 2 Association Rate
    description: wild-type target-2 association rate. Maps to SBML symbol `k_wt_on_2`.
  - name: target_2_dissociation_rate
    maps_to: k_wt_off_2
    label: Target 2 Dissociation Rate
    description: wild-type target-2 dissociation rate. Maps to SBML symbol `k_wt_off_2`.
  outputs:
  - name: state
    maps_to: state
    label: Tracked source state
    description: Tracked SBML observable record for reproducibility and downstream
      visualisation.
  - name: summary
    maps_to: summary
    label: Simulation summary
    description: Largest-change and peak summary across tracked observables.
  - name: species_labels
    maps_to: species_labels
    label: Observable labels
    description: Mapping from raw SBML observable symbols to display labels.
  - name: target_1_drug_complex
    maps_to: R_1_D
    label: Target 1 Drug Complex
    description: Target 1 Drug Complex. Maps to SBML symbol `R_1_D`.
  - name: target_2_drug_complex
    maps_to: R_2_D
    label: Target 2 Drug Complex
    description: Target 2 Drug Complex. Maps to SBML symbol `R_2_D`.
  - name: target_1_drug_effector_complex
    maps_to: R_1_DE
    label: Target 1 Drug Effector Complex
    description: Target 1 Drug Effector Complex. Maps to SBML symbol `R_1_DE`.
  - name: target_2_drug_effector_complex
    maps_to: R_2_DE
    label: Target 2 Drug Effector Complex
    description: Target 2 Drug Effector Complex. Maps to SBML symbol `R_2_DE`.
  - name: selectivity_complex_1
    maps_to: C_1
    label: Selectivity Complex 1
    description: Selectivity Complex 1. Maps to SBML symbol `C_1`.
  - name: selectivity_complex_2
    maps_to: C_2
    label: Selectivity Complex 2
    description: Selectivity Complex 2. Maps to SBML symbol `C_2`.
  - name: selectivity_complex_3
    maps_to: C_3
    label: Selectivity Complex 3
    description: Selectivity Complex 3. Maps to SBML symbol `C_3`.
parameters:
- name: integration_step
  value: 0.2
  min: 0.0
  units: model_time
  description: Output sampling step for the Tellurium simulator.
