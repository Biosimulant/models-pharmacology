schema_version: '2.0'
title: Schropp2019 - Target-Mediated Drug Disposition Model for Bispecific Antibodies
  Lab
description: This model presents a general target-mediated drug disposition (TMDD)
  model for bispecific antibodies (BsAbs), which bind to two different targets on
  different cell membranes. It can be used to explore dose-response dynamics and compare
  treatment scenarios across conditions.
models:
- alias: pharmacology_sbml_schropp2019_target_mediated_drug_disposition_mod_biomd0000000788_model
  path: models/core
  parameters:
    model_path: data/BIOMD0000000788.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: pharmacology_sbml_schropp2019_target_mediated_drug_disposition_mod_biomd0000000788_model.state
  to:
  - visualisation.pharmacology_sbml_schropp2019_target_mediated_drug_disposition_mod_biomd0000000788_model_state
- from: pharmacology_sbml_schropp2019_target_mediated_drug_disposition_mod_biomd0000000788_model.summary
  to:
  - visualisation.pharmacology_sbml_schropp2019_target_mediated_drug_disposition_mod_biomd0000000788_model_summary
- from: pharmacology_sbml_schropp2019_target_mediated_drug_disposition_mod_biomd0000000788_model.species_labels
  to:
  - visualisation.pharmacology_sbml_schropp2019_target_mediated_drug_disposition_mod_biomd0000000788_model_species_labels
runtime:
  duration: 24.0
  communication_step: 1.0
  initial_inputs: {}
tags:
- pharmacology
- pharmacokinetics
- tmdd
- biologics
- immunology
- sbml
- tellurium
- faithful
- biomodels_ebi
