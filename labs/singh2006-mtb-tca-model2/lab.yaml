schema_version: '2.0'
package: singh2006-mtb-tca-model2
version: 1.0.0
title: Singh2006_TCA_mtu_model2 Lab
description: 'This a model from the article: Kinetic modeling of tricarboxylic acid
  cycle and glyoxylate bypass in Mycobacterium tuberculosis, and its application to
  assessment of drug targets. It can be used to explore dose-response dynamics and
  compare treatment scenarios across conditions.'
models:
- alias: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model
  path: models/core
  parameters:
    model_path: data/BIOMD0000000218.xml
    integration_step: 0.05
- alias: visualisation
  path: models/visualisation
wiring:
- from: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.state
  to:
  - visualisation.pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model_state
- from: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.summary
  to:
  - visualisation.pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model_summary
- from: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.species_labels
  to:
  - visualisation.pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model_species_labels
runtime:
  duration: 5.0
  communication_step: 0.5
  initial_inputs: {}
tags:
- pharmacology
- antimicrobial
- tuberculosis
- metabolism
- sbml
- tellurium
- faithful
- biomodels_ebi
io:
  inputs:
  - name: initial_coa_pool
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.initial_coa_pool
    label: Initial Coa Pool
  - name: initial_acetate_or_acetyl_pool
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.initial_acetate_or_acetyl_pool
    label: Initial Acetate Or Acetyl Pool
  - name: initial_oxaloacetate_pool
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.initial_oxaloacetate_pool
    label: Initial Oxaloacetate Pool
  - name: initial_citrate_pool
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.initial_citrate_pool
    label: Initial Citrate Pool
  outputs:
  - name: state
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.state
    label: Tracked source state
  - name: summary
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.summary
    label: Simulation summary
  - name: species_labels
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.species_labels
    label: Observable labels
  - name: coa_pool
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.coa_pool
    label: Coa Pool
  - name: acetate_or_acetyl_pool
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.acetate_or_acetyl_pool
    label: Acetate Or Acetyl Pool
  - name: oxaloacetate_pool
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.oxaloacetate_pool
    label: Oxaloacetate Pool
  - name: citrate_pool
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.citrate_pool
    label: Citrate Pool
  - name: isocitrate_pool
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.isocitrate_pool
    label: Isocitrate Pool
  - name: alpha_ketoglutarate_pool
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.alpha_ketoglutarate_pool
    label: Alpha Ketoglutarate Pool
  - name: succinate_semialdehyde_pool
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.succinate_semialdehyde_pool
    label: Succinate Semialdehyde Pool
  - name: succinate_pool
    maps_to: pharmacology_sbml_singh2006_tca_mtu_model2_biomd0000000218_model.succinate_pool
    label: Succinate Pool
