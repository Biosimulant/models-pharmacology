schema_version: '2.0'
package: grange2001-ldopa-benserazide-interaction
version: 1.0.0
title: Grange2001 - PK interaction of L-dopa and benserazide Lab
description: Grange2001 - PK interaction of L-dopa and benserazide A pharmacokinetics
  of L-dopa in rats after administration of L-dopa alone (BIOMD0000000321) or L-dopa
  combined with a peripheral AADC (amino-acid-. It can be used to explore dose-response
  dynamics and compare treatment scenarios across conditions.
models:
- alias: pharmacology_sbml_grange2001_pk_interaction_of_l_dopa_and_benseraz_biomd0000000320_model
  path: models/core
  parameters:
    model_path: data/BIOMD0000000320.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: pharmacology_sbml_grange2001_pk_interaction_of_l_dopa_and_benseraz_biomd0000000320_model.state
  to:
  - visualisation.pharmacology_sbml_grange2001_pk_interaction_of_l_dopa_and_benseraz_biomd0000000320_model_state
- from: pharmacology_sbml_grange2001_pk_interaction_of_l_dopa_and_benseraz_biomd0000000320_model.summary
  to:
  - visualisation.pharmacology_sbml_grange2001_pk_interaction_of_l_dopa_and_benseraz_biomd0000000320_model_summary
- from: pharmacology_sbml_grange2001_pk_interaction_of_l_dopa_and_benseraz_biomd0000000320_model.species_labels
  to:
  - visualisation.pharmacology_sbml_grange2001_pk_interaction_of_l_dopa_and_benseraz_biomd0000000320_model_species_labels
runtime:
  duration: 24.0
  communication_step: 1.0
  initial_inputs: {}
tags:
- pharmacology
- pharmacokinetics
- drug-interaction
- neuroscience
- sbml
- tellurium
- faithful
- biomodels_ebi
