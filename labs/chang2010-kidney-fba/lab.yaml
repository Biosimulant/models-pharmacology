schema_version: '2.0'
title: Chang2010_Reduced_Kidney_FBA Lab
description: This is the reduced kidney metabolic network described in the article
  Drug off-target effects predicted using structural analysis in the context of a
  metabolic network model. It can be used to explore dose-response dynamics and compare
  treatment scenarios across conditions.
models:
- alias: pharmacology_sbml_chang2010_reduced_kidney_fba_model1011080004_model
  path: models/core
  parameters:
    model_path: data/MODEL1011080004.xml
    integration_step: 0.05
- alias: visualisation
  path: models/visualisation
wiring:
- from: pharmacology_sbml_chang2010_reduced_kidney_fba_model1011080004_model.state
  to:
  - visualisation.pharmacology_sbml_chang2010_reduced_kidney_fba_model1011080004_model_state
- from: pharmacology_sbml_chang2010_reduced_kidney_fba_model1011080004_model.summary
  to:
  - visualisation.pharmacology_sbml_chang2010_reduced_kidney_fba_model1011080004_model_summary
- from: pharmacology_sbml_chang2010_reduced_kidney_fba_model1011080004_model.species_labels
  to:
  - visualisation.pharmacology_sbml_chang2010_reduced_kidney_fba_model1011080004_model_species_labels
runtime:
  duration: 5.0
  communication_step: 0.5
  initial_inputs: {}
tags:
- pharmacology
- metabolism
- kidney
- systems-biology
- fba
- sbml
- tellurium
- faithful
- biomodels_ebi
io:
