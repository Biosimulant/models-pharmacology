  - name: initial_cytosolic_atp
    maps_to: pharmacology_sbml_chang2010_reduced_kidney_fba_model1011080004_model.initial_cytosolic_atp
    label: Initial Cytosolic ATP
  - name: initial_mitochondrial_atp
    maps_to: pharmacology_sbml_chang2010_reduced_kidney_fba_model1011080004_model.initial_mitochondrial_atp
    label: Initial Mitochondrial ATP
  - name: initial_extracellular_glucose
    maps_to: pharmacology_sbml_chang2010_reduced_kidney_fba_model1011080004_model.initial_extracellular_glucose
    label: Initial Extracellular Glucose
  - name: initial_cytosolic_lactate
    maps_to: pharmacology_sbml_chang2010_reduced_kidney_fba_model1011080004_model.initial_cytosolic_lactate
    label: Initial Cytosolic Lactate
  outputs:
  - name: state
    maps_to: pharmacology_sbml_chang2010_reduced_kidney_fba_model1011080004_model.state
    label: Tracked source state
  - name: summary
    maps_to: pharmacology_sbml_chang2010_reduced_kidney_fba_model1011080004_model.summary
    label: Simulation summary
  - name: species_labels
