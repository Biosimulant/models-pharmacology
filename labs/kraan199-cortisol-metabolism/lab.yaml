schema_version: '2.0'
package: kraan199-cortisol-metabolism
version: 1.0.0
title: Kraan199_Kinetics of Cortisol Metabolism and Excretion. Lab
description: A new model is proposed to study the kinetics of [3H]cortisol metabolism
  by using urinary data only. It can be used to explore dose-response dynamics and
  compare treatment scenarios across conditions.
models:
- alias: pharmacology_sbml_kraan199_kinetics_of_cortisol_metabolism_and_exc_biomd0000000916_model
  path: models/core
  parameters:
    model_path: data/BIOMD0000000916.xml
    integration_step: 0.1
- alias: visualisation
  path: models/visualisation
wiring:
- from: pharmacology_sbml_kraan199_kinetics_of_cortisol_metabolism_and_exc_biomd0000000916_model.state
  to:
  - visualisation.pharmacology_sbml_kraan199_kinetics_of_cortisol_metabolism_and_exc_biomd0000000916_model_state
- from: pharmacology_sbml_kraan199_kinetics_of_cortisol_metabolism_and_exc_biomd0000000916_model.summary
  to:
  - visualisation.pharmacology_sbml_kraan199_kinetics_of_cortisol_metabolism_and_exc_biomd0000000916_model_summary
- from: pharmacology_sbml_kraan199_kinetics_of_cortisol_metabolism_and_exc_biomd0000000916_model.species_labels
  to:
  - visualisation.pharmacology_sbml_kraan199_kinetics_of_cortisol_metabolism_and_exc_biomd0000000916_model_species_labels
runtime:
  duration: 24.0
  communication_step: 1.0
  initial_inputs: {}
tags:
- pharmacology
- pharmacokinetics
- endocrine
- metabolism
- sbml
- tellurium
- faithful
- biomodels_ebi
