    maps_to: pharmacology_sbml_kraan199_kinetics_of_cortisol_metabolism_and_exc_biomd0000000916_model.initial_circulating_cortisol
    label: Initial Circulating Cortisol
  - name: initial_urinary_excreted_cortisol
    maps_to: pharmacology_sbml_kraan199_kinetics_of_cortisol_metabolism_and_exc_biomd0000000916_model.initial_urinary_excreted_cortisol
    label: Initial Urinary Excreted Cortisol
  - name: initial_non_urinary_excreted_cortisol
    maps_to: pharmacology_sbml_kraan199_kinetics_of_cortisol_metabolism_and_exc_biomd0000000916_model.initial_non_urinary_excreted_cortisol
